# Render Blueprint: one Node web service that serves the practice page and the
# accounts API. Accounts, progress and every answer attempt are kept in a
# SQLite file on a persistent disk (disks need a paid plan; starter is enough).
# The tools/ folder (generators, knowledge map, notes) is never served.
services:
  - type: web
    # a new name: the old "bebras-practice" service is a static site, and Render
    # cannot turn a static site into a web service
    name: kerbopple
    runtime: node
    # Custom domains (kerbopple.com, www.kerbopple.com) are added in the dashboard,
    # not here: listing a domain another service still holds makes the sync fail.
    plan: starter
    buildCommand: "true"
    startCommand: npm start
    healthCheckPath: /api/me
    disk:
      name: bebras-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /var/data/bebras.db
      - key: NODE_VERSION
        value: "24"
      # Sends confirmation and password-reset emails. Set both in the Render dashboard.
      - key: RESEND_API_KEY
        sync: false
      # A sender on a domain verified in Resend, e.g. "Kerbopple <practice@yourdomain.com>"
      - key: EMAIL_FROM
        sync: false
      # Where links in emails point. Must be the address students use, since sign-in cookies are per address.
      - key: APP_URL
        value: https://kerbopple.com
