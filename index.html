<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kerbopple</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="styles.css">
<script>
  // coach.js (titles, concept names, misconception notes) calls BEBRAS.coach(...). The puzzles come from the server.
  window.BEBRAS = { coachData: null, coach(d) { this.coachData = d; } };
</script>
<script src="coach.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Kerbopple</h1>
    <div class="account" id="account" hidden></div>
    <div class="topbtns">
      <button class="iconbtn" id="soundBtn" aria-pressed="true" aria-label="Sound" title="Sound on or off">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" class="spk"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" class="waves"/><path d="M16 9l5 6M21 9l-5 6" class="mute"/></svg>
      </button>
      <button class="linkbtn" id="progressBtn" hidden>Progress</button>
    </div>
    <div class="modes" role="group" aria-label="How to practice">
      <button class="mode" data-mode="practice" aria-pressed="true">Practice <span class="sub">mixed for you</span></button>
      <button class="mode" data-mode="pick" aria-pressed="false">Pick a puzzle</button>
    </div>
    <div class="tabs" id="famTabs" role="group" aria-label="Puzzle type" hidden>
      <button class="tab" data-fam="rule-tracer">Rule Tracer</button>
      <button class="tab" data-fam="lake-crossing">Lake Crossing</button>
      <button class="tab" data-fam="signal-lamp">Signal Lamp</button>
      <button class="tab" data-fam="robot-routes">Robot Routes</button>
      <button class="tab" data-fam="nuts-and-bolts">Nuts and Bolts</button>
      <button class="tab" data-fam="box-rows">Box Rows</button>
      <button class="tab" data-fam="lights-on">Lights On</button>
      <button class="tab" data-fam="bead-rules">Bead Rules</button>
      <button class="tab" data-fam="pantry-map">Pantry Map</button>
      <button class="tab" data-fam="paint-pipes">Paint Pipes</button>
      <button class="tab" data-fam="code-lock">Code Lock</button>
    </div>
  </div>
  <div class="ladder">
    <span>Level</span><div class="rungs" id="rungs"></div>
    <label class="auto"><input type="checkbox" id="auto" checked> Adjust level automatically</label>
  </div>
  <section class="card" id="card" aria-live="polite"><p>Loading problems…</p></section>
  <details class="coach" id="coach">
    <summary>Coach notes</summary>
    <div id="coachBody"></div>
  </details>
</div>
<script src="sound.js"></script>
<script src="account.js"></script>
<script src="progress.js"></script>
<script src="app.js"></script>
</body>
</html>
